name: Build Phira APK
on: workflow_dispatch

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/27.2.11394342

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Android SDK and NDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-*.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager "ndk;27.2.11394342"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK
        run: |
          cd phira
          cargo apk build --target aarch64-linux-android --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phira-apk
          path: phira/target/aarch64-linux-android/release/android.apk
