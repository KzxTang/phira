name: Build Android Phira
   on: workflow_dispatch
   env:
     CARGO_TERM_COLOR: always
     ANDROID_HOME: ${{ github.workspace }}/android-sdk
     ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
     ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk

   jobs:
     build:
       runs-on: ubuntu-22.04  # 使用新版系统
       steps:
         - uses: actions/checkout@v4  # 更新 checkout 版本

         - run: |
             sudo apt-get update
             sudo apt-get install -y libgtk-3-dev libwebp-dev

         - name: Download static-lib
           uses: suisei-cn/actions-download-file@v1
           with:
             url: "https://teamflos.github.io/phira-docs/prpr-avc.zip"
             target: ./

         - name: Set Up static-lib
           run: unzip prpr-avc.zip -d ./

         - name: Install Android SDK
           run: |
             wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
             unzip commandlinetools-linux-*.zip -d $ANDROID_HOME
             yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"

         - name: Install Android NDK
           run: |
             wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
             unzip android-ndk-r27c-linux.zip -d ${{ github.workspace }}

         - name: Install Rust Toolchain
           uses: actions-rs/toolchain@v1
           with:
             toolchain: stable
             target: aarch64-linux-android

         - name: Build for Android
           run: |
             cd phira
             cargo install cargo-ndk
             cargo ndk -t arm64-v8a -p 33 build --release

         - name: Upload Artifact
           uses: actions/upload-artifact@v4  # 修正拼写错误
           with:
             name: android-build
             path: target/aarch64-linux-android/release/libphira.so
